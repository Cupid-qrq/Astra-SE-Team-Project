name: repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - name: 前端与离线校验运行时
        run: |
          npm install --global pnpm@11.21.0
          python -m pip install -r tools/requirements-model.txt
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: 文档、需求追踪与归档
        run: python tools/check_repository.py
      - name: 开发工具回归
        run: python -m unittest discover -s tools/tests -v
      - name: 已引入的工程检查
        run: python tools/check_runtime.py
      - name: 新提交规范
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: PR空白检查
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)archive/submissions/**'
