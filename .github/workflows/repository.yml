name: repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres-a-test:
        image: postgres:16
        env:
          POSTGRES_DB: astra_a_test
          POSTGRES_USER: astra_test
          POSTGRES_PASSWORD: astra_ci_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U astra_test -d astra_a_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ASTRA_A_DATABASE_URL: postgresql+psycopg://astra_test:astra_ci_test_only@127.0.0.1:5432/astra_a_test?connect_timeout=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - name: 前端与离线校验运行时
        run: |
          npm install --global pnpm@11.21.0
          python -m pip install -r tools/requirements-model.txt
          python -m pip install uv==0.13.5
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: 文档、需求追踪与归档
        run: python tools/check_repository.py
      - name: 开发工具回归
        run: python -m unittest discover -s tools/tests -v
      - name: 已引入的工程检查
        run: python tools/check_runtime.py
      - name: 新提交规范
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: PR空白检查
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)archive/submissions/**'
